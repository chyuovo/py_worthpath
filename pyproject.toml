[project]
name = "py-worthpath"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "pymysql[rsa]>=1.1,<2",
  "python-dotenv>=1,<2",
  "bcrypt>=4,<6",
  "python-multipart>=0.0.20",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
