worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # TLS 可由宿主机反代终止；外层代理应覆盖此请求头并保留原 Host。
    map $http_x_forwarded_proto $worthpath_scheme {
        default $scheme;
        https https;
        http http;
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 513m;

        # Docker 内置 DNS：后端重建更换 IP 后可自动重新解析。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $worthpath_backend http://backend:3100;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 同源代理保留原路径、Cookie、Bearer 和 OAuth 发现路径。
        location ~ ^/(api(?:/|$)|mcp(?:/|$)|\.well-known/|(?:authorize|register|token|revoke)$) {
            proxy_pass $worthpath_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $worthpath_scheme;
            # 丢弃客户端自带的转发链，避免伪造限流来源 IP。
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 授权确认等前端路由刷新时仍返回 SPA 入口。
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
