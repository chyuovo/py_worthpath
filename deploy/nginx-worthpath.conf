# 放入现有 HTTPS 站点的 server 块，替换该站点原 root/index/location 配置。
# listen、server_name、TLS 证书等继续使用已有 Nginx 设置。
root /srv/worthpath/dist;
index index.html;
client_max_body_size 513m;

# 保留 API、MCP、OAuth 的原始路径；后端端口需与 deploy/.env 一致。
location ~ ^/(api(?:/|$)|mcp(?:/|$)|\.well-known/|(?:authorize|register|token|revoke)$) {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 包含授权确认页面在内的前端路由，刷新后仍返回 SPA 入口。
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
