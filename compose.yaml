name: py-worthpath

services:
  app:
    image: git.chyuovo.top/chyuovo/py_worthpath:latest
    # 服务器固定目录；本地从根目录 Dockerfile 构建并推送镜像。
    env_file:
      - /opt/docker/py_worthpath/.env.docker
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: "3100"
      API_ALLOWED_HOSTS: worthpath.chyuovo.top,127.0.0.1:3100
      WEB_ORIGIN: https://worthpath.chyuovo.top
      MCP_PUBLIC_URL: https://worthpath.chyuovo.top/mcp
      MCP_WEB_URL: https://worthpath.chyuovo.top
      MCP_ALLOWED_HOSTS: worthpath.chyuovo.top
      MCP_ALLOWED_ORIGINS: https://worthpath.chyuovo.top
      NETWORK_ALLOW_HTTP: "false"
      NETWORK_ALLOW_HTTP_REDIRECTS: "false"
      NETWORK_ALLOW_WILDCARD_ORIGINS: "false"
      NETWORK_REQUIRE_SECURE_COOKIE: "true"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: strict
      NETWORK_HSTS: "true"
      ICON_STORAGE_DIR: /app/data/icons
      WEB_DIST_DIR: /app/public
    mem_limit: 768m
    memswap_limit: 1g
    cpus: "0.5"
    restart: unless-stopped
    volumes:
      - type: bind
        source: /opt/docker/py_worthpath/data/icons
        target: /app/data/icons
        bind:
          create_host_path: false
      - type: bind
        source: /opt/docker/py_worthpath/runtime
        target: /app/runtime
        bind:
          create_host_path: false
      - type: bind
        source: /opt/docker/py_worthpath/backups
        target: /app/backups
        bind:
          create_host_path: false
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - worthpath
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  worthpath:
    external: true
    name: worthpath
