name: py-worthpath

services:
  app:
    image: py-worthpath:0.1.0
    build:
      context: .
    # 服务器可设 WORTHPATH_ENV_FILE=/opt/docker/worthpath/.env.production 沿用原文件。
    env_file:
      - ${WORTHPATH_ENV_FILE:-./backend/.env.docker}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: "3100"
      API_ALLOWED_HOSTS: worthpath.chyuovo.top,127.0.0.1:3100
      WEB_ORIGIN: https://worthpath.chyuovo.top
      MCP_PUBLIC_URL: https://worthpath.chyuovo.top/mcp
      MCP_WEB_URL: https://worthpath.chyuovo.top
      MCP_ALLOWED_HOSTS: worthpath.chyuovo.top
      MCP_ALLOWED_ORIGINS: https://worthpath.chyuovo.top
      NETWORK_ALLOW_HTTP: "false"
      NETWORK_ALLOW_HTTP_REDIRECTS: "false"
      NETWORK_ALLOW_WILDCARD_ORIGINS: "false"
      NETWORK_REQUIRE_SECURE_COOKIE: "true"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: strict
      NETWORK_HSTS: "true"
      ICON_STORAGE_DIR: /app/data/icons
      WEB_DIST_DIR: /app/public
    mem_limit: 768m
    memswap_limit: 768m
    cpus: "0.5"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${WORTHPATH_ICON_DIR:-/opt/docker/worthpath/data/icons}
        target: /app/data/icons
        bind:
          create_host_path: false
      - app-runtime:/app/runtime
      - app-backups:/app/backups
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - worthpath
    init: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  worthpath:
    external: true
    name: worthpath

volumes:
  app-runtime:
  app-backups:
